name: release-audit
on: [push, pull_request]
jobs:
  python-and-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -r environment/figure-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: python -m unittest discover -s tests -v
      - run: python workflows/audit_release.py
      - run: python workflows/run_contamination_probe.py --offline
      - run: python workflows/reproduce_tables.py --all
      - run: python workflows/reproduce_figures.py --all --allow-source-gaps
      - run: python workflows/verify_figures.py
  physicell-compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 1.14.2 https://github.com/MathCancer/PhysiCell.git vendor/PhysiCell
      - run: make -C vendor/PhysiCell -j2
      - run: make -C physicell/gse2565 PHYSICELL_ROOT="$PWD/vendor/PhysiCell"
      - run: make -C physicell/gse120575 PHYSICELL_ROOT="$PWD/vendor/PhysiCell"
      - run: make -C physicell/gse267904 PHYSICELL_ROOT="$PWD/vendor/PhysiCell"
      - run: make -C physicell/fibrosis_application PHYSICELL_ROOT="$PWD/vendor/PhysiCell"
